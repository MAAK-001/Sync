# What Sync listens for in every conversation (one general guide; there are no roles).
# goals: what a good conversation leaves you with. slots: numbers worth tracking (budget, go-live…).
# vague_terms: words worth pinning down; category = time | quantity | quality | cost.
description: Helps anyone in a conversation that matters leave with clear outcomes.
listens_for:
- the goal of the conversation
- timelines
- who decides
- commitments
- next steps
goals:
- id: goal
  text: The goal of the conversation is clear
  question: 'Ask: what would make this a success for you?'
  keywords:
  - goal
  - objective
  - purpose
  - hoping to
  - looking for
  - want to achieve
  - success
  - outcome
  examples:
  - what we want out of this is
  - our main goal is
  - we are hoping to
  importance: 4
  persist: true
- id: timeline
  text: Timeline or deadline is clear
  question: 'Ask: what''s the timeline we''re working with?'
  keywords:
  - timeline
  - deadline
  - by when
  - schedule
  - due date
  - target date
  examples:
  - we need this done by March
  - the deadline is next month
  importance: 4
  persist: true
- id: decision
  text: Who decides is clear
  question: 'Ask: who else needs to be part of this decision?'
  keywords:
  - decide
  - decision
  - approve
  - approval
  - sign off
  - sign-off
  - final say
  examples:
  - my manager has to approve it
  - the board decides
  importance: 3
  persist: true
- id: next_step
  text: Next step agreed, with an owner and a date
  question: 'Ask: what''s the next step, and who owns it?'
  keywords:
  - next step
  - next steps
  - follow up
  - follow-up
  - next meeting
  - action item
  examples:
  - I'll send you the details by Friday
  - let's meet again next week
  importance: 5
