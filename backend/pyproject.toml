[project]
name = "sync"
version = "0.1.0"
description = "Sync: your personal conversation twin (local-first backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pyyaml>=6",
    "numpy>=1.26",
    "rapidfuzz>=3",
    "dateparser>=1.2",
    "fastembed>=0.4",
    "sherpa-onnx>=1.12",
    "python-multipart>=0.0.9",
    "pypdf>=4",
]

[project.optional-dependencies]
desktop = ["PyAudioWPatch>=0.2.12", "psutil>=5.9", "pywin32>=306", "pystray>=0.19", "pillow>=10", "pycaw>=20240210"]
dev = ["pytest>=8"]

[project.scripts]
sync-server = "sync.main:run"
sync-agent = "sync.desktop.agent:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sync*"]

[tool.setuptools.package-data]
"sync.guide" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm: needs a running Ollama with the configured models (slow)"]
